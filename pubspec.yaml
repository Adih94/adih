name: aplikasi_belajar
description: "Aplikasi belajar anak - Huruf, Piano, Menulis"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Icon bawaan Flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Routing antar halaman
  go_router: ^14.6.2

  # Local storage untuk status VIP & progress belajar
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Audio untuk suara huruf/angka/piano
  audioplayers: ^6.1.0

  # Font playful untuk anak-anak (Baloo 2, Fredoka, dll)
  google_fonts: ^6.2.1

  # Animasi ringan (transisi, efek bintang/confetti)
  flutter_animate: ^4.5.2

  # Animasi Lottie (opsional, untuk karakter/loading lucu)
  lottie: ^3.1.3

  # Text-to-Speech, dipakai sementara untuk suara angka/huruf
  # sebelum ada rekaman suara asli
  flutter_tts: ^4.2.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting rules
  flutter_lints: ^4.0.0

  # Code generator untuk Hive model (opsional, dipakai nanti)
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/bg_classroom.png
    - assets/images/bg_library.png
    - assets/images/character_girl.png
    - assets/images/button_mulai.png
    - assets/images/category_huruf.png
    - assets/images/category_piano.png
    - assets/images/category_menulis.png
    - assets/images/category_suku_vokal.png
    - assets/images/category_suku_sengau.png
    - assets/images/category_suku_ganda.png
    - assets/images/category_mewarnai.png
    - assets/images/bg_reading_classroom.png
    - assets/images/bg_menu.png
    - assets/images/bg_letter_lesson.png
    - assets/images/letter_a_activity.png
    - assets/images/letter_b_activity.png
    - assets/images/bg_letter_lesson2.png
    - assets/images/A.svg
    - assets/images/button_play.svg
    - assets/images/left_button.svg
    - assets/images/right_button.svg
    - assets/images/left_button.png
    - assets/images/right_button.png
    - assets/audio/letters/
    - assets/audio/words/
    # - assets/images/
    # - assets/images/icons/
    # - assets/audio/letters/
    # - assets/audio/numbers/
    # - assets/audio/piano/
    # - assets/lottie/

  # Aktifkan setelah menambahkan file font custom (jika tidak pakai google_fonts)
  # fonts:
